name: Build Turnip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check out and build
        required: true
        type: string
      create_release:
        description: Create a draft GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore signing keystore
        # Configure these repository secrets: KEYSTORE_BASE64 (a base64-encoded
        # JKS/keystore file), KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "KEYSTORE_BASE64 repository secret is required" >&2
            exit 1
          fi

          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/turnip-release.keystore"
          test -s "${RUNNER_TEMP}/turnip-release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "${variable} repository secret is required" >&2
              exit 1
            fi
          done

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease \
            "-Pandroid.injected.signing.store.file=${RUNNER_TEMP}/turnip-release.keystore" \
            "-Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD}" \
            "-Pandroid.injected.signing.key.alias=${KEY_ALIAS}" \
            "-Pandroid.injected.signing.key.password=${KEY_PASSWORD}"

      - name: Prepare release files and checksums
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi

          cp "${apks[0]}" dist/
          (
            cd dist
            sha256sum -- *.apk > checksums.txt
          )

          {
            echo 'checksums<<CHECKSUMS'
            cat dist/checksums.txt
            echo 'CHECKSUMS'
          } >> "${GITHUB_OUTPUT}"

          cat dist/checksums.txt

      - name: Upload APK and checksums
        uses: actions/upload-artifact@v7
        with:
          name: turnip-${{ inputs.tag }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error

      - name: Create draft release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Turnip ${{ inputs.tag }}
          draft: true
          body: |
            # Turnip ${{ inputs.tag }}

            ## Checksums
            ```text
            ${{ steps.package.outputs.checksums }}
            ```
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
